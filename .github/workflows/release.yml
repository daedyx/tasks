# Release von Daedyx Tasks: bauen, signieren, in das öffentliche Repository daedyx/releases veröffentlichen.
# Starten: Actions -> Release -> "Run workflow" auf dem Zweig main (Version, Änderungsnotiz und Bestätigung eintragen)
#   oder einen Tag v<x.y.z> pushen, dessen Commit auf main liegt. Von jedem anderen Zweig geht nur der Trockenlauf.
# Trockenlauf: Haken "Trockenlauf" setzen: es wird gebaut, getestet und signiert, aber nichts in daedyx/releases geschrieben
#   und keine Version zurückgeschrieben; das Setup hängt 3 Tage als Download am Lauf. Nötig sind dann nur die Update-Schlüssel und CORE_READ_TOKEN.
# Geheimnisse (Repository-Secrets, trägt Björn selbst ein, Anleitung: docs/RELEASE.md):
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD  Update-Schlüssel der App
#   DAEDYX_CATALOG_KEY, DAEDYX_KEY_PASSWORD                        Katalog-Schlüssel (Inhalt der Datei) und Passwort
#   RELEASES_TOKEN                                                 Zugriffstoken mit Schreibrecht nur auf daedyx/releases
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, zum Beispiel 0.1.0 (muss höher sein als die letzte veröffentlichte)"
        required: true
        type: string
      notes:
        description: "Änderungsnotiz: was ist neu?"
        required: true
        type: string
      skip_tests:
        description: "Tests überspringen (nur im Notfall)"
        required: false
        type: boolean
        default: false
      confirm:
        description: "Bestätigung für die echte Veröffentlichung: die Version noch einmal eintippen (beim Trockenlauf leer lassen)"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Trockenlauf: bauen, testen, signieren, aber NICHT veröffentlichen (das Setup hängt als Download am Lauf)"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

# Das Token des Workflows darf nur den Quellcode-Stand zurückschreiben (Versionsdateien); veröffentlicht wird mit RELEASES_TOKEN.
permissions:
  contents: write

# Nie zwei Veröffentlichungen gleichzeitig: beide würden denselben Katalog ändern.
concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASES_REPO: daedyx/releases

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Eingaben prüfen
        id: input
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_NOTES: ${{ github.event.inputs.notes }}
          INPUT_SKIP_TESTS: ${{ github.event.inputs.skip_tests }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          # Eingaben nur über Umgebungsvariablen lesen (nie in den Skripttext einsetzen).
          # Regeln (scripts/ci/check-release-inputs.ps1, Probe: test-check-release-inputs.ps1):
          # echte Veröffentlichung nur von main oder von einem Tag auf main, Tests überspringen nur im Trockenlauf, Bestätigung nötig.
          $onMain = 'false'
          if ($env:EVENT -eq 'push') {
            git fetch --no-tags origin main
            git merge-base --is-ancestor $env:SHA origin/main
            if ($LASTEXITCODE -eq 0) { $onMain = 'true' }
          }
          $r = ./scripts/ci/check-release-inputs.ps1 -EventName $env:EVENT -Ref $env:REF `
            -InputVersion $env:INPUT_VERSION -InputNotes $env:INPUT_NOTES -InputSkipTests $env:INPUT_SKIP_TESTS `
            -InputDryRun $env:INPUT_DRY_RUN -InputConfirm $env:INPUT_CONFIRM -TagOnMain $onMain -Product Tasks
          $file = Join-Path $env:RUNNER_TEMP 'release-notes.txt'
          [System.IO.File]::WriteAllText($file, $r.Notes, (New-Object System.Text.UTF8Encoding $false))
          "version=$($r.Version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "notes_file=$file" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "skip_tests=$($r.SkipTests)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "dry_run=$($r.DryRun)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if (-not (Test-Path 'release/catalog.pub')) { throw "release/catalog.pub fehlt (öffentlicher Katalog-Schlüssel, siehe docs/RELEASE.md)." }

      - name: Secrets prüfen
        env:
          S1: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          S2: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          S3: ${{ secrets.DAEDYX_CATALOG_KEY }}
          S4: ${{ secrets.DAEDYX_KEY_PASSWORD }}
          S5: ${{ secrets.RELEASES_TOKEN }}
          DRY: ${{ steps.input.outputs.dry_run }}
        run: |
          $missing = @()
          if (-not $env:S1) { $missing += 'TAURI_SIGNING_PRIVATE_KEY' }
          if (-not $env:S2) { $missing += 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD' }
          # Katalog-Schlüssel und Release-Token braucht nur die echte Veröffentlichung, nicht der Trockenlauf
          if ($env:DRY -ne 'True' -and $env:DRY -ne 'true') {
            if (-not $env:S3) { $missing += 'DAEDYX_CATALOG_KEY' }
            if (-not $env:S4) { $missing += 'DAEDYX_KEY_PASSWORD' }
            if (-not $env:S5) { $missing += 'RELEASES_TOKEN' }
          }
          if ($missing) { throw "Diese Secrets fehlen im Repository: $($missing -join ', ') (Anleitung: docs/RELEASE.md)" }

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Rust einrichten
        uses: dtolnay/rust-toolchain@stable

      - name: Rust-Zwischenspeicher
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Privaten Kern abrufen (Token nur für diesen Schritt)
        env:
          CORE_READ_TOKEN: ${{ secrets.CORE_READ_TOKEN }}
        run: |
          if (-not $env:CORE_READ_TOKEN) { throw "Secret CORE_READ_TOKEN fehlt (Lesezugriff auf daedyx/core)" }
          # Die Umleitung gilt nur für Prozesse dieses Schritts (kein "git config --global"): spätere Schritte mit
          # Fremdbibliotheken (npm ci, Build-Skripte) sehen das Token nicht. Danach baut cargo aus dem Zwischenspeicher.
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'url.https://x-access-token:' + $env:CORE_READ_TOKEN + '@github.com/daedyx/core.insteadOf'
          $env:GIT_CONFIG_VALUE_0 = 'https://github.com/daedyx/core'
          $env:CARGO_NET_GIT_FETCH_WITH_CLI = 'true'
          cargo fetch --locked --manifest-path app/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "Abruf der Abhängigkeiten fehlgeschlagen" }

      - name: Abhängigkeiten installieren
        working-directory: app
        run: npm ci

      - name: Katalog-Werkzeug laden
        run: scripts/ci/fetch-catalog-tool.ps1 -Destination "$env:RUNNER_TEMP/daedyx-catalog.exe"

      - name: Bauen, prüfen, Setup und Update-Signatur erzeugen
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ steps.input.outputs.version }}
          NOTES_FILE: ${{ steps.input.outputs.notes_file }}
          SKIP_TESTS: ${{ steps.input.outputs.skip_tests }}
        run: |
          $notes = Get-Content $env:NOTES_FILE -Raw
          $base = "https://github.com/$env:RELEASES_REPO/releases/download/tasks-v$env:VERSION/"
          $out = Join-Path $env:RUNNER_TEMP 'tasks-out'
          $params = @{ Version = $env:VERSION; Notes = $notes; BaseUrl = $base; OutDir = $out; NoCatalog = $true }
          if ($env:SKIP_TESTS -eq 'True' -or $env:SKIP_TESTS -eq 'true') { $params.SkipTests = $true }
          ./scripts/release.ps1 @params

      - name: Trockenlauf – Setup als Download am Lauf bereitstellen
        if: steps.input.outputs.dry_run == 'True' || steps.input.outputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tasks-trockenlauf-${{ steps.input.outputs.version }}
          path: ${{ runner.temp }}/tasks-out
          retention-days: 3

      - name: In daedyx/releases veröffentlichen
        if: steps.input.outputs.dry_run != 'True' && steps.input.outputs.dry_run != 'true'
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          DAEDYX_CATALOG_KEY: ${{ secrets.DAEDYX_CATALOG_KEY }}
          DAEDYX_KEY_PASSWORD: ${{ secrets.DAEDYX_KEY_PASSWORD }}
          VERSION: ${{ steps.input.outputs.version }}
          NOTES_FILE: ${{ steps.input.outputs.notes_file }}
        run: |
          ./scripts/ci/publish.ps1 -Version $env:VERSION `
            -OutDir (Join-Path $env:RUNNER_TEMP 'tasks-out') `
            -NotesFile $env:NOTES_FILE `
            -PublicKey release/catalog.pub `
            -CatalogTool (Join-Path $env:RUNNER_TEMP 'daedyx-catalog.exe') `
            -ReleasesRepo $env:RELEASES_REPO

      - name: Versionsdateien zurück in den Quellcode schreiben
        if: github.event_name == 'workflow_dispatch' && steps.input.outputs.dry_run != 'True' && steps.input.outputs.dry_run != 'true'
        env:
          VERSION: ${{ steps.input.outputs.version }}
        run: |
          git config user.name "daedyx release bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add app/package.json app/src-tauri/Cargo.toml app/src-tauri/Cargo.lock app/src-tauri/tauri.conf.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: Version $env:VERSION"
            git push origin HEAD
          }
