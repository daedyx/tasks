# Release von Daedyx Tasks ohne gespeicherte Geheimnisse (plan-ohne-secrets Schritt 6, Review U2 F-U2-2).
# Noch nie gelaufen. Offene Punkte für den ersten Lauf (L4, L5, L5b) stehen in docs/RELEASE.md.
#
# Ablauf: Björn startet ihn von Hand (Actions -> Release -> Run workflow, Zweig main). Vier Jobs, jeder nur mit den
# Rechten für seine Aufgabe (Review T7v, N-T7v-4 und M-T7v-3):
# - "bauen", nur Lesen: Eingaben prüfen, testen, Produkt-Fassung (Merkmal produkt) und Setup bauen, entry.json
#   schreiben, Prüfprogramm bauen. Übergabe als Artefakt, Prüfsummen als Job-Ausgabe.
# - "bezeugen" nach Björns Freigabe im Environment "release", mit der Kennung für den Nachweis: Prüfsummen gegenprüfen,
#   GitHub bezeugt Eintrag und Setup (Sigstore, kein Schlüssel). Startet nichts aus der Übergabe.
# - "pruefen", nur Lesen: das Prüfprogramm aus dem Bau (Prüfweg der App) und gh prüfen Release und Nachweis.
# - "veroeffentlichen", nur contents: write: Prüfsummen gegenprüfen, Release v<Version> hier anlegen. Startet nichts aus
#   der Übergabe.
# Programme aus dem Bau laufen also nur in Jobs ohne Kennung und ohne Schreibrecht.
# Kein Secret, kein Zwischenspeicher, kein Zurückschreiben in den Quellcode.
# Die App prüft genau diesen Nachweis: Workflow .github/workflows/release.yml, Zweig refs/heads/main, Repo daedyx/tasks
# mit festen Kennungen (crates/tasks-app/src/update.rs; Test release_tests.rs hält beide Seiten zusammen).
# Voraussetzungen: dieses Repository sowie daedyx/core und daedyx/ui sind öffentlich (Nachweise gibt es nur für
# öffentliche Repositories; ohne Lese-Token muss cargo die Abhängigkeiten frei abrufen können).
# Aktionen per Commit-ID, nachgeschlagen am 2026-11-27 per gh api (Tag -> Commit), Quellen in docs/RELEASE.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, zum Beispiel 0.2.0 (muss der Version in tasks-app/Cargo.toml entsprechen)"
        required: true
        type: string
      notes:
        description: "Änderungsnotiz: was ist neu? (eine Zeile, ohne Links)"
        required: true
        type: string
      confirm:
        description: "Bestätigung: die Version noch einmal eintippen"
        required: true
        type: string

permissions: {}

# Nie zwei Veröffentlichungen gleichzeitig.
concurrency:
  group: release
  cancel-in-progress: false

env:
  RUST_VERSION: "1.99.1"
  CARGO_TERM_COLOR: never

jobs:
  bauen:
    name: Testen und bauen
    # Nur auf main im eigenen Repository; ein Fork oder ein anderer Zweig startet den Job gar nicht.
    if: github.ref == 'refs/heads/main' && github.repository == 'daedyx/tasks'
    # Fester Läufer, damit der Release-Bau nachvollziehbar bleibt (Review T7v, H-T7v-2). windows-2022, weil nur dessen
    # Runner-Image NSIS vorinstalliert hat (windows-2025 nicht mehr, Release-Lauf 2); kein Nachinstall.
    runs-on: windows-2022
    timeout-minutes: 120
    # Nur Lesen: Tests und Bau-Skripte fremder Bausteine laufen hier, ohne Kennung für den Nachweis.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.eingaben.outputs.version }}
      pruefsummen: ${{ steps.uebergabe.outputs.pruefsummen }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: NSIS auf dem Läufer belegen (aus dem Runner-Image, kein Nachinstall)
        run: |
          $nsis = @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $nsis) { $nsis = (Get-Command makensis -ErrorAction SilentlyContinue).Source }
          if (-not $nsis) { throw "makensis fehlt auf dem Läufer" }
          "makensis: $nsis"
          & $nsis /VERSION
          if ($LASTEXITCODE -ne 0) { throw "makensis /VERSION fehlgeschlagen" }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Eingaben prüfen
        id: eingaben
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_NOTES: ${{ inputs.notes }}
          INPUT_CONFIRM: ${{ inputs.confirm }}
        run: |
          # Eingaben nur über Umgebungsvariablen lesen, nie in den Skripttext einsetzen.
          $v = $env:INPUT_VERSION.Trim()
          if ($v -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw "Version muss x.y.z sein" }
          if ($env:INPUT_CONFIRM.Trim() -ne $v) { throw "Bestätigung stimmt nicht mit der Version überein" }
          $line = Select-String -Path app/src-tauri/crates/tasks-app/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $line -or $line.Matches[0].Groups[1].Value -ne $v) { throw "Version $v steht nicht in tasks-app/Cargo.toml (erst dort anheben)" }
          $notes = $env:INPUT_NOTES.Trim()
          if (-not $notes) { throw "Änderungsnotiz fehlt" }
          New-Item -ItemType Directory -Force uebergabe/release-dateien | Out-Null
          [IO.File]::WriteAllText((Join-Path $PWD 'uebergabe/notiz.txt'), $notes, (New-Object System.Text.UTF8Encoding $false))
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Release darf es noch nicht geben (Releases nie ersetzen)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.eingaben.outputs.version }}
        run: |
          gh release view "v$env:VERSION" --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release v$env:VERSION gibt es schon" }
          git ls-remote --exit-code --tags origin "refs/tags/v$env:VERSION" *> $null
          if ($LASTEXITCODE -eq 0) { throw "Tag v$env:VERSION gibt es schon" }
          # Nie unter das bisherige Latest: sonst meldet jede App „Quelle liefert ältere Version“ (H-U1-3, H-T7v-1).
          # Ohne bisheriges Release (erster Lauf) gibt es nichts zu vergleichen.
          $latest = gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq .tagName 2> $null
          if ($LASTEXITCODE -eq 0 -and $latest) {
            if ([version]$env:VERSION -le [version]($latest.Trim().TrimStart('v'))) { throw "Version $env:VERSION ist nicht neuer als $latest" }
          }
          exit 0

      - name: Rust festnageln
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION

      - name: Abhängigkeiten abrufen (öffentliche Quellen, nach Cargo.lock)
        working-directory: app/src-tauri
        run: |
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) { throw "Abruf der Abhängigkeiten fehlgeschlagen" }

      - name: Tests (Vorschau und Produkt-Fassung)
        working-directory: app/src-tauri
        run: |
          cargo test --workspace --locked --offline --no-fail-fast
          if ($LASTEXITCODE -ne 0) { throw "Tests rot" }
          cargo test -p daedyx-tasks-app --features produkt --locked --offline --no-fail-fast
          if ($LASTEXITCODE -ne 0) { throw "Tests der Produkt-Fassung rot" }

      - name: Produkt-Fassung und Prüfprogramm bauen
        working-directory: app/src-tauri
        run: |
          # Programmziel daedyx-tasks (daedyx-tasks.exe), nur mit produkt (L3).
          cargo build --release --locked --offline -p daedyx-tasks-app --features produkt --bin daedyx-tasks
          if ($LASTEXITCODE -ne 0) { throw "Bau fehlgeschlagen" }
          # Selbstprüfung für den Job "pruefen" (Review T7v, M-T7v-2): der Prüfweg der App mit dem echten GitHub-Prüfer.
          cargo build --release --locked --offline -p daedyx-tasks-app --features produkt --example release_selbstpruefung
          if ($LASTEXITCODE -ne 0) { throw "Bau des Prüfprogramms fehlgeschlagen" }
          Copy-Item target/release/examples/release_selbstpruefung.exe ../../uebergabe/release_selbstpruefung.exe

      - name: Setup bauen
        env:
          VERSION: ${{ steps.eingaben.outputs.version }}
        run: |
          # Produkt-Setup installer/tasks.nsi und Programm daedyx-tasks.exe (L2, L3; Test setup_produkt_tests.rs).
          $nsi = 'installer/tasks.nsi'
          if (-not (Test-Path $nsi)) { throw "$nsi fehlt" }
          . ./scripts/lib/vorlage-installer.ps1
          $vorlage = Get-InstallerVorlage (Resolve-Path app/src-tauri) -Offline
          $out = Join-Path $env:RUNNER_TEMP 'setup'
          & (Join-Path $vorlage 'installer-bauen.ps1') -Workspace (Resolve-Path app/src-tauri) -Package daedyx-tasks-app `
            -Exe daedyx-tasks.exe -Nsi (Resolve-Path $nsi) -Icon (Resolve-Path app/src-tauri/icons/icon.ico) `
            -Version $env:VERSION -OutDir $out -SkipBuild -Offline
          $setups = @(Get-ChildItem $out -Filter '*-setup.exe')
          if ($setups.Count -ne 1) { throw "Genau ein Setup erwartet, gefunden: $($setups.Count)" }
          Copy-Item $setups[0].FullName "uebergabe/release-dateien/daedyx-tasks-$env:VERSION-setup.exe"

      - name: entry.json schreiben
        # Windows PowerShell 5.1, genau die Fassung, mit der release_flow_tests.rs das Skript prüft (N-T7v-3).
        shell: powershell
        env:
          VERSION: ${{ steps.eingaben.outputs.version }}
        run: |
          ./scripts/ci/make-entry.ps1 -App daedyx-tasks -Repo $env:GITHUB_REPOSITORY -Version $env:VERSION `
            -Date (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd') -NotesFile uebergabe/notiz.txt `
            -Setup "uebergabe/release-dateien/daedyx-tasks-$env:VERSION-setup.exe" -Out uebergabe/release-dateien/entry.json

      - name: Prüfsummen der Übergabe festhalten
        id: uebergabe
        run: |
          # Jeder spätere Job vergleicht die geladenen Dateien mit diesen Summen (Artefakte sind kein Vertrauensanker).
          $zeilen = Get-ChildItem uebergabe -Recurse -File | Sort-Object FullName | ForEach-Object {
            $rel = [IO.Path]::GetRelativePath((Resolve-Path uebergabe).Path, $_.FullName).Replace('\', '/')
            "$rel=$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())"
          }
          "pruefsummen=$($zeilen -join ';')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Übergabe ablegen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-uebergabe
          path: uebergabe/
          if-no-files-found: error
          retention-days: 1

  bezeugen:
    name: Bezeugen
    needs: bauen
    if: github.ref == 'refs/heads/main' && github.repository == 'daedyx/tasks'
    runs-on: windows-2025
    timeout-minutes: 30
    # Freigabe-Klick: Das Environment "release" verlangt Björns Genehmigung (docs/RELEASE.md, Schritt 7). Es sitzt hier,
    # weil hier die Kennung für den Nachweis entsteht (Review T7v, M-T7v-3).
    environment: release
    # Nur die Kennung für den Nachweis. Dieser Job startet nichts aus der Übergabe (M-T7v-3).
    permissions:
      id-token: write # Identität des Workflows für den Nachweis
      attestations: write # Nachweis bei GitHub ablegen
    outputs:
      nachweis: ${{ steps.nachweis_summe.outputs.nachweis }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Übergabe holen
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-uebergabe
          path: uebergabe

      - name: Prüfsummen gegenprüfen
        env:
          ERWARTET: ${{ needs.bauen.outputs.pruefsummen }}
        run: |
          $zeilen = Get-ChildItem uebergabe -Recurse -File | Sort-Object FullName | ForEach-Object {
            $rel = [IO.Path]::GetRelativePath((Resolve-Path uebergabe).Path, $_.FullName).Replace('\', '/')
            "$rel=$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())"
          }
          if (-not $env:ERWARTET -or ($zeilen -join ';') -ne $env:ERWARTET) { throw "Übergabe weicht vom Bau ab" }

      - name: Nachweis erzeugen (Sigstore, ohne Schlüssel)
        id: nachweis
        # v4.2.2 ruft actions/attest per Commit-ID auf (508db95…, v4.2.1). Ob die Fassung Rekor-v1-Einträge schreibt, wie
        # die App sie verlangt, belegt erst die Selbstprüfung im Job "pruefen".
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            uebergabe/release-dateien/entry.json
            uebergabe/release-dateien/daedyx-tasks-${{ needs.bauen.outputs.version }}-setup.exe

      - name: Prüfsumme des Nachweises festhalten
        id: nachweis_summe
        env:
          BUNDLE: ${{ steps.nachweis.outputs.bundle-path }}
        run: |
          New-Item -ItemType Directory -Force nachweis | Out-Null
          Copy-Item $env:BUNDLE nachweis/provenance.sigstore.json
          $summe = (Get-FileHash -LiteralPath nachweis/provenance.sigstore.json -Algorithm SHA256).Hash.ToLowerInvariant()
          "nachweis=provenance.sigstore.json=$summe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Nachweis ablegen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-nachweis
          path: nachweis/
          if-no-files-found: error
          retention-days: 1

  pruefen:
    name: Wie jede App prüfen
    needs: [bauen, bezeugen]
    if: github.ref == 'refs/heads/main' && github.repository == 'daedyx/tasks'
    runs-on: windows-2025
    timeout-minutes: 30
    # Nur Lesen: Hier läuft das Prüfprogramm aus dem Bau-Job. Es bekommt keine Kennung und kein Schreibrecht, und kein
    # späterer Job verwendet etwas aus diesem Job außer seinem Erfolg (M-T7v-3).
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Übergabe holen
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-uebergabe
          path: uebergabe

      - name: Nachweis holen
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-nachweis
          path: nachweis

      - name: Prüfsummen gegenprüfen
        env:
          ERWARTET: ${{ needs.bauen.outputs.pruefsummen }}
          NACHWEIS: ${{ needs.bezeugen.outputs.nachweis }}
        run: |
          function Get-Summen($ordner) {
            $basis = (Resolve-Path $ordner).Path
            (Get-ChildItem $ordner -Recurse -File | Sort-Object FullName | ForEach-Object {
              $rel = [IO.Path]::GetRelativePath($basis, $_.FullName).Replace('\', '/')
              "$rel=$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())"
            }) -join ';'
          }
          if (-not $env:ERWARTET -or (Get-Summen uebergabe) -ne $env:ERWARTET) { throw "Übergabe weicht vom Bau ab" }
          if (-not $env:NACHWEIS -or (Get-Summen nachweis) -ne $env:NACHWEIS) { throw "Nachweis weicht ab" }
          Copy-Item nachweis/provenance.sigstore.json uebergabe/release-dateien/provenance.sigstore.json

      - name: Mit dem Prüfweg der App prüfen (wie jede installierte App)
        # Review T7v, M-T7v-2: Der Kern ist strenger als gh (Rekor v1, eingefrorene Vertrauenswurzel, Regeln für
        # entry.json). Was er hier ablehnt, würde jede App ablehnen; deshalb dann kein Release.
        env:
          VERSION: ${{ needs.bauen.outputs.version }}
        run: |
          $dir = (Resolve-Path uebergabe/release-dateien).Path
          $work = Join-Path $env:RUNNER_TEMP 'selbstpruefung'
          & ./uebergabe/release_selbstpruefung.exe $dir $env:VERSION $work
          if ($LASTEXITCODE -ne 0) { throw "Die App würde dieses Release ablehnen" }

      - name: Zweite Prüfung mit gh attestation verify
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.bauen.outputs.version }}
        run: |
          foreach ($f in @('uebergabe/release-dateien/entry.json', "uebergabe/release-dateien/daedyx-tasks-$env:VERSION-setup.exe")) {
            gh attestation verify $f --bundle uebergabe/release-dateien/provenance.sigstore.json --repo $env:GITHUB_REPOSITORY `
              --signer-workflow "$env:GITHUB_REPOSITORY/.github/workflows/release.yml" --source-ref refs/heads/main `
              --deny-self-hosted-runners
            if ($LASTEXITCODE -ne 0) { throw "Nachweis für $f nicht gültig" }
          }

  veroeffentlichen:
    name: Veröffentlichen
    needs: [bauen, bezeugen, pruefen]
    if: github.ref == 'refs/heads/main' && github.repository == 'daedyx/tasks'
    runs-on: windows-2025
    timeout-minutes: 30
    # Nur das Release anlegen. Dieser Job startet nichts aus der Übergabe (M-T7v-3).
    permissions:
      contents: write # Release anlegen (eingebautes Token, gilt nur für diesen Lauf)
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Übergabe holen
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-uebergabe
          path: uebergabe

      - name: Nachweis holen
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-nachweis
          path: nachweis

      - name: Prüfsummen gegenprüfen
        env:
          ERWARTET: ${{ needs.bauen.outputs.pruefsummen }}
          NACHWEIS: ${{ needs.bezeugen.outputs.nachweis }}
        run: |
          function Get-Summen($ordner) {
            $basis = (Resolve-Path $ordner).Path
            (Get-ChildItem $ordner -Recurse -File | Sort-Object FullName | ForEach-Object {
              $rel = [IO.Path]::GetRelativePath($basis, $_.FullName).Replace('\', '/')
              "$rel=$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())"
            }) -join ';'
          }
          if (-not $env:ERWARTET -or (Get-Summen uebergabe) -ne $env:ERWARTET) { throw "Übergabe weicht vom Bau ab" }
          if (-not $env:NACHWEIS -or (Get-Summen nachweis) -ne $env:NACHWEIS) { throw "Nachweis weicht ab" }
          Copy-Item nachweis/provenance.sigstore.json uebergabe/release-dateien/provenance.sigstore.json

      - name: Release anlegen (Setup, entry.json, Nachweis)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.bauen.outputs.version }}
        run: |
          # Alle Dateien beim Anlegen, damit auch unveränderliche Releases gehen. --latest: die App holt latest/download.
          Set-Location uebergabe
          gh release create "v$env:VERSION" "release-dateien/daedyx-tasks-$env:VERSION-setup.exe" release-dateien/entry.json release-dateien/provenance.sigstore.json --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Daedyx Tasks $env:VERSION" --notes-file notiz.txt --latest
          if ($LASTEXITCODE -ne 0) { throw "Release konnte nicht angelegt werden" }
