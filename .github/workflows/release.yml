# Release von Daedyx Tasks ohne gespeicherte Geheimnisse (plan-ohne-secrets Schritt 6, Review U2 F-U2-2).
# ENTWURF aus der T7-Vorbereitung: noch nie gelaufen. Vor dem ersten Lauf die Lücken in docs/RELEASE.md schließen.
#
# Ablauf: Björn startet ihn von Hand (Actions -> Release -> Run workflow, Zweig main) und gibt die Freigabe im
# Environment "release". Der Lauf prüft die Eingaben, testet, baut die Produkt-Fassung (Merkmal produkt), baut das
# Setup, schreibt entry.json, lässt GitHub beides bezeugen (Sigstore, kein Schlüssel), prüft beides mit
# dem Prüfweg der App und legt das Release v<Version> in diesem Repository an. Kein Secret, kein Zwischenspeicher, kein Zurückschreiben in den Quellcode.
# Die App prüft genau diesen Nachweis: Workflow .github/workflows/release.yml, Zweig refs/heads/main, Repo daedyx/tasks
# mit festen Kennungen (crates/tasks-app/src/update.rs; Test release_tests.rs hält beide Seiten zusammen).
# Voraussetzungen: dieses Repository sowie daedyx/core und daedyx/ui sind öffentlich (Nachweise gibt es nur für
# öffentliche Repositories; ohne Lese-Token muss cargo die Abhängigkeiten frei abrufen können).
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, zum Beispiel 0.3.0 (muss der Version in tasks-app/Cargo.toml entsprechen)"
        required: true
        type: string
      notes:
        description: "Änderungsnotiz: was ist neu? (eine Zeile, ohne Links)"
        required: true
        type: string
      confirm:
        description: "Bestätigung: die Version noch einmal eintippen"
        required: true
        type: string

permissions: {}

# Nie zwei Veröffentlichungen gleichzeitig.
concurrency:
  group: release
  cancel-in-progress: false

env:
  RUST_VERSION: "1.99.1"
  CARGO_TERM_COLOR: never

jobs:
  release:
    name: Bauen, bezeugen, veröffentlichen
    # Nur auf main im eigenen Repository; ein Fork oder ein anderer Zweig startet den Job gar nicht.
    if: github.ref == 'refs/heads/main' && github.repository == 'daedyx/tasks'
    # Fester Läufer, damit der Release-Bau nachvollziehbar bleibt (Review T7v, H-T7v-2).
    runs-on: windows-2025
    timeout-minutes: 120
    # Freigabe-Klick: Das Environment "release" verlangt Björns Genehmigung (docs/RELEASE.md, Schritt 3).
    environment: release
    permissions:
      contents: write # Release anlegen (eingebautes Token, gilt nur für diesen Lauf)
      id-token: write # Identität des Workflows für den Nachweis
      attestations: write # Nachweis bei GitHub ablegen
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Eingaben prüfen
        id: eingaben
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_NOTES: ${{ inputs.notes }}
          INPUT_CONFIRM: ${{ inputs.confirm }}
        run: |
          # Eingaben nur über Umgebungsvariablen lesen, nie in den Skripttext einsetzen.
          $v = $env:INPUT_VERSION.Trim()
          if ($v -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw "Version muss x.y.z sein" }
          if ($env:INPUT_CONFIRM.Trim() -ne $v) { throw "Bestätigung stimmt nicht mit der Version überein" }
          $line = Select-String -Path app/src-tauri/crates/tasks-app/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $line -or $line.Matches[0].Groups[1].Value -ne $v) { throw "Version $v steht nicht in tasks-app/Cargo.toml (erst dort anheben)" }
          $notes = $env:INPUT_NOTES.Trim()
          if (-not $notes) { throw "Änderungsnotiz fehlt" }
          $file = Join-Path $env:RUNNER_TEMP 'notiz.txt'
          [IO.File]::WriteAllText($file, $notes, (New-Object System.Text.UTF8Encoding $false))
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "notes_file=$file" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Release darf es noch nicht geben (Releases nie ersetzen)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.eingaben.outputs.version }}
        run: |
          gh release view "v$env:VERSION" --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release v$env:VERSION gibt es schon" }
          git ls-remote --exit-code --tags origin "refs/tags/v$env:VERSION" *> $null
          if ($LASTEXITCODE -eq 0) { throw "Tag v$env:VERSION gibt es schon" }
          # Nie unter das bisherige Latest: sonst meldet jede App „Quelle liefert ältere Version“ (H-U1-3, H-T7v-1).
          # Ohne bisheriges Release (erster Lauf) gibt es nichts zu vergleichen.
          $latest = gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq .tagName 2> $null
          if ($LASTEXITCODE -eq 0 -and $latest) {
            if ([version]$env:VERSION -le [version]($latest.Trim().TrimStart('v'))) { throw "Version $env:VERSION ist nicht neuer als $latest" }
          }
          exit 0

      - name: Rust festnageln
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION

      - name: Abhängigkeiten abrufen (öffentliche Quellen, nach Cargo.lock)
        working-directory: app/src-tauri
        run: |
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) { throw "Abruf der Abhängigkeiten fehlgeschlagen" }

      - name: Tests (Vorschau und Produkt-Fassung)
        working-directory: app/src-tauri
        run: |
          cargo test --workspace --locked --offline --no-fail-fast
          if ($LASTEXITCODE -ne 0) { throw "Tests rot" }
          cargo test -p daedyx-tasks-app --features produkt --locked --offline --no-fail-fast
          if ($LASTEXITCODE -ne 0) { throw "Tests der Produkt-Fassung rot" }

      - name: Produkt-Fassung bauen
        working-directory: app/src-tauri
        run: |
          cargo build --release --locked --offline -p daedyx-tasks-app --features produkt
          if ($LASTEXITCODE -ne 0) { throw "Bau fehlgeschlagen" }

      - name: Setup bauen
        env:
          VERSION: ${{ steps.eingaben.outputs.version }}
        run: |
          # Produkt-Setup und Programmname der Produkt-Fassung entstehen in T7 (Lücken L2 und L3 in docs/RELEASE.md).
          $nsi = 'installer/tasks.nsi'
          if (-not (Test-Path $nsi)) { throw "$nsi fehlt (Produkt-Setup kommt in T7)" }
          . ./scripts/lib/vorlage-installer.ps1
          $vorlage = Get-InstallerVorlage (Resolve-Path app/src-tauri) -Offline
          $out = Join-Path $env:RUNNER_TEMP 'setup'
          & (Join-Path $vorlage 'installer-bauen.ps1') -Workspace (Resolve-Path app/src-tauri) -Package daedyx-tasks-app `
            -Exe daedyx-tasks.exe -Nsi (Resolve-Path $nsi) -Icon (Resolve-Path app/src-tauri/icons/icon.ico) `
            -Version $env:VERSION -OutDir $out -SkipBuild -Offline
          $setups = @(Get-ChildItem $out -Filter '*-setup.exe')
          if ($setups.Count -ne 1) { throw "Genau ein Setup erwartet, gefunden: $($setups.Count)" }
          New-Item -ItemType Directory -Force release-dateien | Out-Null
          Copy-Item $setups[0].FullName "release-dateien/daedyx-tasks-$env:VERSION-setup.exe"

      - name: entry.json schreiben
        # Windows PowerShell 5.1, genau die Fassung, mit der release_flow_tests.rs das Skript prüft (N-T7v-3).
        shell: powershell
        env:
          VERSION: ${{ steps.eingaben.outputs.version }}
          NOTES_FILE: ${{ steps.eingaben.outputs.notes_file }}
        run: |
          ./scripts/ci/make-entry.ps1 -App daedyx-tasks -Repo $env:GITHUB_REPOSITORY -Version $env:VERSION `
            -Date (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd') -NotesFile $env:NOTES_FILE `
            -Setup "release-dateien/daedyx-tasks-$env:VERSION-setup.exe" -Out release-dateien/entry.json

      - name: Nachweis erzeugen (Sigstore, ohne Schlüssel)
        id: nachweis
        # LÜCKE L1: volle Commit-ID der gewünschten Fassung eintragen (lag in der T7-Vorbereitung nicht vor). Mit lauter
        # Nullen findet GitHub die Aktion nicht und bricht den Job vor dem ersten Schritt ab.
        uses: actions/attest-build-provenance@0000000000000000000000000000000000000000 # LÜCKE L1
        with:
          subject-path: |
            release-dateien/entry.json
            release-dateien/daedyx-tasks-${{ steps.eingaben.outputs.version }}-setup.exe

      - name: Nachweis beilegen
        env:
          BUNDLE: ${{ steps.nachweis.outputs.bundle-path }}
        run: Copy-Item $env:BUNDLE release-dateien/provenance.sigstore.json

      - name: Mit dem Prüfweg der App prüfen (wie jede installierte App)
        # Review T7v, M-T7v-2: Der Kern ist strenger als gh (Rekor v1, eingefrorene Vertrauenswurzel, Regeln für
        # entry.json). Was er hier ablehnt, würde jede App ablehnen; deshalb dann kein Release.
        working-directory: app/src-tauri
        env:
          VERSION: ${{ steps.eingaben.outputs.version }}
        run: |
          $dir = (Resolve-Path ../../release-dateien).Path
          $work = Join-Path $env:RUNNER_TEMP 'selbstpruefung'
          cargo run --release --locked --offline -p daedyx-tasks-app --features produkt --example release_selbstpruefung -- $dir $env:VERSION $work
          if ($LASTEXITCODE -ne 0) { throw "Die App würde dieses Release ablehnen" }

      - name: Zweite Prüfung mit gh attestation verify
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.eingaben.outputs.version }}
        run: |
          foreach ($f in @('release-dateien/entry.json', "release-dateien/daedyx-tasks-$env:VERSION-setup.exe")) {
            gh attestation verify $f --bundle release-dateien/provenance.sigstore.json --repo $env:GITHUB_REPOSITORY `
              --signer-workflow "$env:GITHUB_REPOSITORY/.github/workflows/release.yml" --source-ref refs/heads/main `
              --deny-self-hosted-runners
            if ($LASTEXITCODE -ne 0) { throw "Nachweis für $f nicht gültig" }
          }

      - name: Release anlegen (Setup, entry.json, Nachweis)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.eingaben.outputs.version }}
          NOTES_FILE: ${{ steps.eingaben.outputs.notes_file }}
        run: |
          # Alle Dateien beim Anlegen, damit auch unveränderliche Releases gehen. --latest: die App holt latest/download.
          gh release create "v$env:VERSION" "release-dateien/daedyx-tasks-$env:VERSION-setup.exe" release-dateien/entry.json release-dateien/provenance.sigstore.json --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Daedyx Tasks $env:VERSION" --notes-file $env:NOTES_FILE --latest
          if ($LASTEXITCODE -ne 0) { throw "Release konnte nicht angelegt werden" }
