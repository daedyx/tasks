# Prüfung bei Push und Pull Request auf main (SICHERHEIT 6.2 und Anhang E, wie daedyx/ui und Desk; Tasks T6).
# Nur Lesen, Actions per voller Commit-ID, kein pull_request_target. Der Cargo-Workspace liegt in app/src-tauri.
# Kein Secret: daedyx/core und daedyx/ui sind öffentlich (seit 2026-11-27, A-031 entfallen). Der Release-Ablauf
# (release.yml) braucht ebenfalls keins.
name: ci

on:
  # Wieder voll (Entscheid CI-1, 2026-11-25): Seit core und ui öffentlich sind, läuft die Prüfung auf jedem Zweig.
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  RUST_VERSION: "1.99.1"
  CARGO_TERM_COLOR: never

jobs:
  # Zuerst und allein: Scan und Ausnahmenzähler auf einem frischen Checkout, bevor irgendein Code aus dem Repo läuft.
  # Das Prüfprogramm wird ohne Cargo direkt mit rustc gebaut (nur Standardbibliothek): keine Cargo-Konfiguration, kein
  # Build-Skript, kein Abruf. Es liest den Commit (`--head`), nicht den Arbeitsordner.
  vorpruefung:
    name: scan, exceptions (vor jedem Build)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cargo-Konfiguration und Prüfprogramm prüfen (ohne Cargo)
        shell: pwsh
        run: |
          $muster = '(^|/)(\.cargo/config(\.toml)?|rust-toolchain(\.toml)?)$'
          $dateien = @(git ls-files | Where-Object { $_ -match $muster })
          if ($dateien.Count -ne 1 -or $dateien[0] -ne 'app/src-tauri/.cargo/config.toml') { throw "Nur app/src-tauri/.cargo/config.toml ist erlaubt, gefunden: $dateien" }
          $erlaubt = @('[alias]', 'xtask = "run --quiet --package xtask --"')
          $zeilen = @(Get-Content app/src-tauri/.cargo/config.toml | ForEach-Object { $_.Trim() } | Where-Object { $_ -and -not $_.StartsWith('#') })
          if (($zeilen -join "`n") -ne ($erlaubt -join "`n")) { throw ".cargo/config.toml enthält mehr als den xtask-Alias" }
          if (git ls-files 'app/src-tauri/xtask/build.rs') { throw "xtask/build.rs ist nicht erlaubt" }
          $xtask = @(Get-Content app/src-tauri/xtask/Cargo.toml | ForEach-Object { $_.Trim() } | Where-Object { $_ -and -not $_.StartsWith('#') })
          if ($xtask | Where-Object { $_ -match '^\[.*dependencies' -or $_ -match '^build\s*=' -or $_ -match 'proc-macro' }) { throw "xtask/Cargo.toml darf keine Abhängigkeiten und kein Build-Skript haben" }
      - name: Keine Secrets in Workflows (nur das automatische GITHUB_TOKEN; release.yml ohne jedes Secret)
        shell: pwsh
        run: |
          # Auch Zugriff mit eckigen Klammern und toJSON über alle Secrets zählt (Review T6, H6-2). Groß/klein beachten:
          # das Wort Secrets in Kommentaren ist kein Zugriff.
          $treffer = Select-String -Path .github/workflows/*.yml -CaseSensitive -Pattern 'secrets\.(?!GITHUB_TOKEN\b)', 'secrets\[', 'toJSON\(\s*secrets'
          if ($treffer) { $treffer; throw "Unerwartetes Secret in einem Workflow" }
          # Der Release-Weg kommt ganz ohne Secret aus (plan-ohne-secrets). Gesucht wird jeder Zugriff (Punkt, eckige
          # Klammer, Klammer wie bei toJSON, Weitergabe an andere Workflows), nicht das bloße Wort (Review T7v, M-T7v-1).
          # Die Zeile mit den Mustern steht wörtlich so im Test release_tests.rs, der sie gegen Beispiele prüft.
          $releaseMuster = 'secrets\s*[.\[:)]', '\(\s*secrets'
          if (Select-String -Path .github/workflows/release.yml -CaseSensitive -Pattern $releaseMuster) { throw "release.yml darf kein Secret lesen" }
      - name: Rust festnageln
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION
      - name: Prüfprogramm ohne Cargo bauen
        shell: pwsh
        run: rustc --edition 2024 -O app/src-tauri/xtask/src/main.rs -o "$env:RUNNER_TEMP\xtask.exe"
      - name: scan
        shell: pwsh
        working-directory: app/src-tauri
        run: '& "$env:RUNNER_TEMP\xtask.exe" scan --head'
      - name: exceptions
        shell: pwsh
        working-directory: app/src-tauri
        run: '& "$env:RUNNER_TEMP\xtask.exe" exceptions --head'

  pruefen:
    name: fmt, clippy, test, Testzahl
    needs: vorpruefung
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust festnageln
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal --component clippy,rustfmt
          rustup default $env:RUST_VERSION
      - name: Abhängigkeiten abrufen (öffentliche Quellen, nach Cargo.lock)
        shell: pwsh
        run: |
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) { throw "Abruf der Abhängigkeiten fehlgeschlagen" }
      # Das Prüfprogramm vor jedem anderen Code bauen und beiseitelegen.
      - name: xtask bauen
        shell: pwsh
        run: |
          cargo build --locked --offline --package xtask
          Copy-Item .\target\debug\xtask.exe "$env:RUNNER_TEMP\xtask.exe"
      # Formatprüfung nur für die Crates, die schon nach rustfmt formatiert sind (Bestand: docs/STAND.md).
      - run: cargo fmt -p daedyx-tasks-app -p daedyx-tasks-store -p xtask --check
      # Nie `--all-features`: das schaltet `produkt` ein (docs/STAND.md). Die Produkt-Fassung prüft ein eigener Schritt.
      - run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - run: cargo clippy -p daedyx-tasks-app --all-targets --features produkt --locked --offline -- -D warnings
      # bash läuft bei GitHub mit `-eo pipefail`: ein Fehler in `cargo test` bleibt trotz `tee` rot.
      - name: Tests mit Protokoll
        shell: bash
        run: cargo test --workspace --locked --offline --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Kennungen der Produkt-Fassung (Programmtest und Startprobe)
        run: cargo test -p daedyx-tasks-app --features produkt --test kennung --test start_probe --locked --offline
      # Der Release-Lauf testet unter pwsh 7, nicht unter bash: Die Tests, die Windows PowerShell 5.1 starten, laufen
      # deshalb auch hier unter pwsh (Release-Lauf 1 war nur dort rot).
      - name: PowerShell-Tests unter pwsh (wie im Release-Lauf)
        shell: pwsh
        run: |
          cargo test -p daedyx-tasks-app --lib --locked --offline release_tests
          if ($LASTEXITCODE -ne 0) { throw "PowerShell-Tests unter pwsh rot" }
      # Keine Testgruppe darf still wegfallen: Mindestzahl je Testprogramm aus dem Commit (xtask/testzahlen.txt).
      - name: Testzahl
        shell: pwsh
        run: '& "$env:RUNNER_TEMP\xtask.exe" testzahl "$env:RUNNER_TEMP\test.log" --head'
      # Tests dürfen keine versionierten Dateien ändern.
      - name: Arbeitsordner unverändert
        shell: pwsh
        run: |
          $aenderungen = git status --porcelain --untracked-files=no
          if ($aenderungen) { throw "Tests haben versionierte Dateien geändert: $aenderungen" }

  lieferkette:
    name: cargo deny, cargo audit
    needs: vorpruefung
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust festnageln
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Werkzeuge in fester Version (Quelle crates.io, Prüfsummen über Cargo.lock der Werkzeuge)
        run: |
          cargo install --locked cargo-deny --version 0.20.2
          cargo install --locked cargo-audit --version 0.22.2
      - name: Abhängigkeiten abrufen (öffentliche Quellen, nach Cargo.lock)
        run: cargo fetch --locked
      # Die Advisory-Datenbank vor der Prüfung holen (wie ui und launcher); `--offline` liest sie dann nur.
      - run: cargo deny --locked fetch db
      - run: cargo deny --locked --offline check advisories bans licenses sources
      - run: cargo audit --deny warnings
