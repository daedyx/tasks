# SICHERHEIT.md Anhang B: in Tests sind unwrap/expect/panic/Index erlaubt, im Produktivcode nicht.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
disallowed-methods = [
  { path = "std::process::Command::new", reason = "Prozesse nur über daedyx-sys (SICHERHEIT 2.7, kommt mit T1)" },
  { path = "std::net::TcpStream::connect", reason = "Netz nur über ein NetGate (2.6)" },
  { path = "std::env::temp_dir", reason = "Temp nur im eigenen Datenordner (2.8)" },
  { path = "rusqlite::Connection::open", reason = "Datenbank nur über daedyx-tasks-store (Plan 4.2)" },
  { path = "rusqlite::Connection::open_with_flags", reason = "Datenbank nur über daedyx-tasks-store (Plan 4.2)" },
]
