# Store von Tasks: wie ../../clippy.toml, nur ohne die Sperre von `Connection::open` (hier darf geöffnet werden).
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
disallowed-methods = [
  { path = "std::process::Command::new", reason = "Prozesse nur über daedyx-sys (SICHERHEIT 2.7, kommt mit T1)" },
  { path = "std::net::TcpStream::connect", reason = "Netz nur über ein NetGate (2.6)" },
  { path = "std::env::temp_dir", reason = "Temp nur im eigenen Datenordner (2.8)" },
]
