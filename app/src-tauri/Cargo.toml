[package]
name = "daedyx-tasks"
version = "0.1.0"
description = "Daedyx Tasks"
authors = ["Daedyx"]
edition = "2024"

[lib]
name = "daedyx_tasks_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-mcp-bridge = { version = "0.13.2", optional = true }
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
keyring = { version = "3", features = ["windows-native"] }
getrandom = "0.3"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
tokio = { version = "1", features = ["time"] }
# Aufgaben-Kern (eigenes privates Repository). Die Release-Pipeline braucht dafür das Secret CORE_READ_TOKEN.
daedyx-tasks-core = { git = "https://github.com/daedyx/core", rev = "86ea2fc" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[features]
# Nur für `npm run tauri:dev`: Konnektor, damit Claude die laufende App sehen kann (127.0.0.1).
dev-bridge = ["dep:tauri-plugin-mcp-bridge"]
